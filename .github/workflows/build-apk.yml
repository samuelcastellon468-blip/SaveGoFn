# ESTE ARCHIVO CONFIGURA GITHUB ACTIONS PARA COMPILAR EL APK AUTOMÁTICAMENTE EN LA NUBE
# CADA VEZ QUE SE SUBE CÓDIGO A LA RAMA "main", SIN NECESIDAD DE INSTALAR ANDROID STUDIO
# NI JAVA EN LA COMPUTADORA LOCAL. EL RESULTADO SE PUEDE DESCARGAR DESDE LA PESTAÑA "Actions".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Angular
        run: npx ng build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: SaveGo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          