name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install
        working-directory: ./status-saver-ios

      - name: Compilar Angular
        run: npx ng build
        working-directory: ./status-saver-ios

      - name: Sincronizar Capacitor
        run: npx cap sync android
        working-directory: ./status-saver-ios

      - name: Dar permisos y compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
        working-directory: ./status-saver-ios

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: SaveGo-apk
          path: status-saver-ios/android/app/build/outputs/apk/debug/app-debug.apk
